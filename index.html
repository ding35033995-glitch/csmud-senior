<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>找到你落腳行星｜學長姐分組測驗</title>
<style>
:root{--bg:#08111f;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--text:#f7f8fb;--muted:#aab4c5;--accent:#aebeff;--accent2:#d9dcff}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:radial-gradient(circle at 20% 10%,#1d2c50 0,transparent 34%),radial-gradient(circle at 80% 30%,#252554 0,transparent 30%),var(--bg);color:var(--text);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:75px 75px;opacity:.10}.wrap{width:min(920px,100%);margin:auto;padding:24px 18px 48px}.screen{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center}.panel{width:100%;background:rgba(8,17,31,.78);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,52px);box-shadow:0 20px 80px rgba(0,0,0,.28)}.badge{display:inline-flex;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;margin-bottom:18px}.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.06;margin:0 0 18px;letter-spacing:-1px}.hero p{font-size:17px;line-height:1.85;color:var(--muted);max-width:650px}.btn{touch-action:manipulation;border:0;border-radius:16px;padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;min-height:52px}.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#12172a}.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn:active{transform:scale(.98)}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.progress{height:7px;background:#152033;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#abbcff,#f1eaff);width:0;transition:.25s}.qnum{font-size:13px;color:var(--muted)}h2{font-size:clamp(25px,5vw,38px);margin:14px 0 26px;line-height:1.3}.options{display:grid;gap:12px}.opt{min-height:60px;width:100%;text-align:left;background:rgba(255,255,255,.055);color:var(--text);border:1px solid var(--line);padding:18px;border-radius:18px;cursor:pointer;font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}.opt:hover,.opt:focus-visible,.opt.selected{border-color:#bbc4ff;background:rgba(187,196,255,.11)}.result{text-align:center}.planet{font-size:84px;line-height:1;margin:8px 0 18px}.result h2{margin-bottom:10px}.desc{color:var(--muted);line-height:1.9;font-size:16px;max-width:650px;margin:0 auto 22px}.groupbox{border:1px solid var(--line);border-radius:20px;padding:18px;margin:24px 0;background:rgba(255,255,255,.045)}.groupname{font-size:26px;font-weight:800}.small{color:var(--muted);font-size:13px;line-height:1.7}.admin-input{appearance:none;-webkit-appearance:none;width:100%;padding:13px 14px;background:#0f1829;border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:16px}
@media(max-width:620px){.wrap{padding:10px}.screen{min-height:calc(100svh - 20px)}.panel{border-radius:20px;padding:22px 16px}.hero h1{font-size:clamp(32px,10vw,48px)}.hero p{font-size:16px;line-height:1.8}.top{margin-bottom:20px}.options{gap:10px}.opt{min-height:62px;padding:16px;font-size:16px}.row{gap:9px;margin-top:20px}.row .btn{width:100%}.admin-input{min-height:52px}}
</style>
</head>
<body><div class="wrap"><div id="app"></div></div>
<script>
const planets=[
 {name:'金星',group:'金星組',emoji:'♀',tag:'魅力派',desc:'像金星一樣耀眼炙熱，用獨特魅力吸引身邊的目光。'},
 {name:'地球',group:'地球組',emoji:'🌍',tag:'生命派',desc:'像地球孕育生命，重視連結與合作，讓團隊充滿可能。'},
 {name:'火星',group:'火星組',emoji:'♂',tag:'探索派',desc:'像火星般勇於探索未知，面對挑戰總想親自踏上征途。'},
 {name:'木星',group:'木星組',emoji:'♃',tag:'領導派',desc:'像太陽系最大的木星，擁有強大氣場，守護並帶領夥伴前進。'},
 {name:'土星',group:'土星組',emoji:'♄',tag:'穩重派',desc:'像土星環繞自身的行星環，井然有序，穩定而可靠。'},
 {name:'天王星',group:'天王星組',emoji:'♅',tag:'獨特派',desc:'像側躺自轉的天王星，不走尋常路，總用自己的方式看世界。'},
 {name:'海王星',group:'海王星組',emoji:'♆',tag:'神秘派',desc:'像遙遠深藍的海王星，神秘而深邃，藏著無限想像與可能。'}
];
const questions=['到了新的班級，你通常會怎麼開始？','團體活動時，你最享受哪一種角色？','遇到陌生任務時，你的第一反應是？','大家意見不一致時，你會？','臨時收到新的活動安排，你會？','你最容易被哪種人吸引成為朋友？','你認為自己最值得被看見的特質是？','如果團隊卡住了，你比較可能？','理想的大學生活對你來說是？','今天測驗結束，你最期待？'];
const opts=[['主動找人聊天','先觀察氣氛','直接開始行動','找一個有共同話題的人'],['提出點子','帶頭執行','照顧大家感受','把流程整理好'],['先試了再說','先找資料','找大家討論','想一個不一樣的方法'],['提出自己的想法','協調大家的立場','讓大家先冷靜','找出最快能執行的方法'],['覺得很刺激','先確認細節','先看看大家怎麼想','立刻調整計畫'],['很有活力的人','可靠穩定的人','很有想法的人','會讓大家自在的人'],['反應很快','很會照顧人','很有責任感','總能想到新點子'],['換個方法試試','把問題拆小','找人一起解決','帶大家先做起來'],['認識很多新朋友','嘗試以前沒做過的事','和夥伴一起成長','留下很多值得回憶的事'],['找到適合自己的夥伴','發現自己的新面貌','開始一段新的冒險','看看自己會是哪顆行星']];
const map=[[0,2,4,6],[1,3,5,7],[4,0,7,2],[5,3,6,1],[2,7,1,4],[6,5,3,0],[0,4,7,5],[1,6,2,3],[7,2,5,4],[3,1,6,0]];
let state={q:0,scores:Array(8).fill(0),name:''};const app=document.getElementById('app');
function home(){app.innerHTML=`<div class="screen"><section class="panel hero"><span class="badge">學長姐專用｜行星人格分組測驗</span><h1>找到你落腳行星</h1><p>在認親大會之前，先看看你將於哪顆行星降落。在那裡，引領你大學生活燈塔－ 直屬正在等你</p><div class="row"><button class="btn btn-primary" onclick="start()">開始探索</button></div><p class="small">學長姐分為 7 組：金星、地球、火星、木星、土星、天王星、海王星；水星不列入分組。</p></section></div>`}
function start(){state={q:0,scores:Array(8).fill(0),name:''};renderQ()}
function renderQ(){const i=state.q;if(i<questions.length){app.innerHTML=`<div class="screen"><section class="panel"><div class="top"><span class="qnum">第 ${i+1} / ${questions.length+1} 題</span><span class="qnum">學長姐｜七大行星分組</span></div><div class="progress"><div style="width:${(i/(questions.length+1))*100}%"></div></div><h2>${questions[i]}</h2><div class="options">${opts[i].map((x,j)=>`<button class="opt" onclick="answer(${j})">${x}</button>`).join('')}</div><div class="row"><button class="btn btn-ghost" ${i===0?'disabled':''} onclick="prev()">上一題</button></div></section></div>`}else{app.innerHTML=`<div class="screen"><section class="panel"><div class="top"><span class="qnum">第 ${questions.length+1} / ${questions.length+1} 題</span><span class="qnum">最後一步</span></div><div class="progress"><div style="width:100%"></div></div><h2>請留下年級/本名 （ex:大三 彼得帕克）</h2><input id="identity" class="admin-input" type="text" maxlength="50" placeholder="大三 彼得帕克"><p class="small">此資訊僅供活動主辦方查看。</p><div class="row"><button class="btn btn-ghost" onclick="prev()">上一題</button><button class="btn btn-primary" onclick="submitIdentity()">查看我的結果</button></div></section></div>`}}
function answer(j){state.scores[map[state.q][j]]++;state.q++;renderQ()}
function prev(){if(state.q>0){state.q--;renderQ()}}
async function submitIdentity(){const name=(document.getElementById('identity')?.value||'').trim();if(!name){alert('請留下年級與本名');return}state.name=name;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,scores:state.scores})});const data=await r.json();if(!r.ok)throw new Error(data.error||'送出失敗');const p=planets[data.groupIndex-1];if(!p)throw new Error('分組結果異常');app.innerHTML=`<div class="screen"><section class="panel result"><span class="badge">學長姐｜測驗完成</span><div class="planet">${p.emoji}</div><div class="qnum">你的落腳行星</div><h2>${p.name}｜${p.tag}</h2><p class="desc">${p.desc}</p><div class="groupbox"><div class="groupname">${p.group}</div><div class="small">這就是你的落腳行星。</div></div><p class="small">你的參加編號：${data.id}</p><div class="row"><button class="btn btn-primary" onclick="home()">完成</button></div></section></div>`}catch(e){buttons.forEach(b=>b.disabled=false);alert(e.message)}}
home();
</script></body></html>
